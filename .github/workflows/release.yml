name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.*
      - run: python3 scripts/validate.py
      - name: Check the tag matches the manifest version
        run: |
          v=$(python3 -c 'import json;print(json.load(open(".codex-plugin/plugin.json"))["version"])')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest version v$v"; exit 1; }
      - run: python3 scripts/package.py
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/joinforme-skill.zip dist/joinforme-plugin.zip dist/SHA256SUMS --clobber

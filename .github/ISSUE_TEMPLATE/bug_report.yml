name: Bug report
description: Something didn't work when your assistant used joinfor.me
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Don't paste API keys, sign-in codes or meeting links** — they're private.
        For security problems, email info@pattern-ai.com instead (see SECURITY.md).
  - type: input
    id: assistant
    attributes:
      label: Assistant or client
      placeholder: e.g. Claude (web), ChatGPT, Grok Bot, Claude Code, Cursor, OpenClaw
    validations:
      required: true
  - type: dropdown
    id: way-in
    attributes:
      label: How it's connected
      options:
        - Remote MCP (OAuth sign-in)
        - Remote MCP (API key)
        - Skill + HTTPS API
        - Plugin / extension from this repository
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Meeting platform
      options:
        - Google Meet
        - Zoom
        - Microsoft Teams
        - Not about a meeting
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the tool name and the error text if you have them. A meeting ID (mtg_…) helps us look it up.
    validations:
      required: true
